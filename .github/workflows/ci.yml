name: CI Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  lint:
    name: Lint y formato de código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar Ruff
        run: pip install ruff

      - name: Ejecutar Ruff (linting)
        run: ruff check . --output-format=full --show-fixes --statistics || true

      - name: Verificar formato
        run: ruff format --check --diff . || true

  database:
    name: Sincronización de base de datos (Neon)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear/actualizar esquema en Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.verify_db

      - name: Ejecutar seeder en Neon (datos iniciales)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.seeder

  docker:
    name: Build de imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de imagen Docker
        run: docker build -f docker/Dockerfile -t tilinflex-backend:ci .
#El contenedor se destruye automáticamente al finalizar el job, por lo que no es necesario agregar un paso para eliminarlo.
